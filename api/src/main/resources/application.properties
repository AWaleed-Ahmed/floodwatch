spring.application.name=floodwatch-api
# Reads the shared settings file at the project root (floodwatch/.env)
spring.config.import=optional:file:../.env[.properties]
server.port=${SERVER_PORT:8090}

floodwatch.open-meteo.forecast-url=${OPEN_METEO_FORECAST_URL:https://api.open-meteo.com/v1/forecast}
floodwatch.open-meteo.flood-url=${OPEN_METEO_FLOOD_URL:https://flood-api.open-meteo.com/v1/flood}
floodwatch.open-meteo.archive-url=${OPEN_METEO_ARCHIVE_URL:https://archive-api.open-meteo.com/v1/archive}
floodwatch.open-meteo.elevation-url=${OPEN_METEO_ELEVATION_URL:https://api.open-meteo.com/v1/elevation}
floodwatch.http.user-agent=${HTTP_USER_AGENT:FloodWatch-student-prototype}
floodwatch.http.max-body-bytes=${MAX_REQUEST_BODY_BYTES:65536}
floodwatch.cache.forecast-ttl-minutes=${FORECAST_CACHE_TTL_MINUTES:30}
floodwatch.alerts.check-interval-minutes=${ALERT_CHECK_INTERVAL_MINUTES:15}
floodwatch.alerts.cooldown-hours=${ALERT_COOLDOWN_HOURS:6}

# Storage: local JSON files until SUPABASE_URL is set, then the Supabase bucket
floodwatch.storage.local-dir=${LOCAL_DATA_DIR:../data}
floodwatch.storage.supabase-url=${SUPABASE_URL:}
floodwatch.storage.supabase-key=${SUPABASE_SERVICE_KEY:}
floodwatch.storage.bucket=${SUPABASE_BUCKET:floodwatch-data}

floodwatch.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
